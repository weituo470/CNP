<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">

  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0.25 0" in="n"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4d2a8"/>
      <stop offset="1" stop-color="#c9ae7e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#paper)"/>
  <rect width="800" height="420" filter="url(#grain)" opacity="0.45"/>
  <rect x="16" y="16" width="768" height="388" fill="none" stroke="#5a4330" stroke-width="1.2" stroke-opacity="0.45"/>


  <g transform="translate(640,28)">
    <rect x="0" y="0" width="132" height="44" fill="none" stroke="#9c2b1a" stroke-width="2"/>
    <text x="66" y="18" text-anchor="middle" font-family="Noto Serif SC, Songti SC, serif" font-size="13" fill="#9c2b1a">示意 · typological</text>
    <text x="66" y="34" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#9c2b1a">历史想象图</text>
  </g>


  <text x="28" y="48" font-family="Noto Serif SC, serif" font-size="20" fill="#1c2418">谋略 · 国家技艺</text>
  <text x="28" y="76" font-family="EB Garamond, serif" font-size="14" fill="#3a4630">Concealment, operational surprise, fighting while talking.</text>
  <g font-family="Noto Serif SC, serif" font-size="15" fill="#1c2418">
    <rect x="60" y="130" width="200" height="160" fill="none" stroke="#c45c4a" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="160" y="200" text-anchor="middle">隐蔽入朝</text>
    <text x="160" y="222" text-anchor="middle" font-size="11" fill="#3a4630" font-family="IBM Plex Mono, monospace">concealment</text>
    <rect x="300" y="130" width="200" height="160" fill="none" stroke="#7a96a8" stroke-width="1.8"/>
    <text x="400" y="200" text-anchor="middle">仁川突然性</text>
    <text x="400" y="222" text-anchor="middle" font-size="11" fill="#3a4630" font-family="IBM Plex Mono, monospace">Incheon surprise</text>
    <rect x="540" y="130" width="200" height="160" fill="none" stroke="#9c2b1a" stroke-width="1.8"/>
    <text x="640" y="200" text-anchor="middle">边打边谈</text>
    <text x="640" y="222" text-anchor="middle" font-size="11" fill="#3a4630" font-family="IBM Plex Mono, monospace">fight while talking</text>
  </g>
  <path d="M260 210 L 300 210" stroke="#5c6840" stroke-width="1.6" marker-end="none"/>
  <path d="M500 210 L 540 210" stroke="#5c6840" stroke-width="1.6"/>

<text x="28" y="398" font-family="IBM Plex Mono, monospace" font-size="11" fill="#3a4630"> strategy as a state decision  ·  谋略是一种国家技艺</text>
</svg>
