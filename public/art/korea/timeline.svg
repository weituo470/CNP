<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">

  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0.25 0" in="n"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4d2a8"/>
      <stop offset="1" stop-color="#c9ae7e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#paper)"/>
  <rect width="800" height="420" filter="url(#grain)" opacity="0.45"/>
  <rect x="16" y="16" width="768" height="388" fill="none" stroke="#5a4330" stroke-width="1.2" stroke-opacity="0.45"/>


  <g transform="translate(640,28)">
    <rect x="0" y="0" width="132" height="44" fill="none" stroke="#9c2b1a" stroke-width="2"/>
    <text x="66" y="18" text-anchor="middle" font-family="Noto Serif SC, Songti SC, serif" font-size="13" fill="#9c2b1a">示意 · typological</text>
    <text x="66" y="34" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#9c2b1a">历史想象图</text>
  </g>


  <text x="28" y="48" font-family="Noto Serif SC, serif" font-size="20" fill="#1c2418">时间尺 · 1950–1953</text>
  <line x1="70" y1="200" x2="740" y2="200" stroke="#2c3a4a" stroke-width="2"/>
  <g font-family="Noto Serif SC, serif" font-size="13" fill="#1c2418">
    <g transform="translate(90,200)"><circle r="6" fill="#2c3a4a"/><text x="-28" y="-16">1950.6</text><text x="-36" y="28">爆发</text><text x="-40" y="46" font-size="10" fill="#3a4630">Outbreak</text></g>
    <g transform="translate(220,200)"><circle r="6" fill="#7a96a8"/><text x="-28" y="-16">1950.9</text><text x="-28" y="28">仁川</text><text x="-32" y="46" font-size="10" fill="#3a4630">Incheon</text></g>
    <g transform="translate(350,200)"><circle r="6" fill="#c45c4a"/><text x="-32" y="-16">1950.10</text><text x="-28" y="28">渡江</text><text x="-44" y="46" font-size="10" fill="#3a4630">Crosses Yalu</text></g>
    <g transform="translate(490,200)"><circle r="6" fill="#d9a05a"/><text x="-40" y="-16">1950–51</text><text x="-36" y="28">五次战役</text><text x="-48" y="46" font-size="10" fill="#3a4630">Five campaigns</text></g>
    <g transform="translate(620,200)"><circle r="6" fill="#5c6840"/><text x="-28" y="-16">1951.7</text><text x="-36" y="28">边打边谈</text><text x="-40" y="46" font-size="10" fill="#3a4630">Talks begin</text></g>
    <g transform="translate(730,200)"><circle r="6" fill="#9c2b1a"/><text x="-32" y="-16">1953.7</text><text x="-28" y="28">停战</text><text x="-44" y="46" font-size="10" fill="#3a4630">Armistice</text></g>
  </g>
  <text x="28" y="90" font-family="EB Garamond, serif" font-size="14" fill="#3a4630">A typological time-scale, not a daily operations log.</text>

<text x="28" y="398" font-family="IBM Plex Mono, monospace" font-size="11" fill="#3a4630">Dates follow official campaign histories and the armistice text</text>
</svg>
