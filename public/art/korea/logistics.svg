<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">

  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0.25 0" in="n"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4d2a8"/>
      <stop offset="1" stop-color="#c9ae7e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#paper)"/>
  <rect width="800" height="420" filter="url(#grain)" opacity="0.45"/>
  <rect x="16" y="16" width="768" height="388" fill="none" stroke="#5a4330" stroke-width="1.2" stroke-opacity="0.45"/>


  <g transform="translate(640,28)">
    <rect x="0" y="0" width="132" height="44" fill="none" stroke="#9c2b1a" stroke-width="2"/>
    <text x="66" y="18" text-anchor="middle" font-family="Noto Serif SC, Songti SC, serif" font-size="13" fill="#9c2b1a">示意 · typological</text>
    <text x="66" y="34" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#9c2b1a">历史想象图</text>
  </g>


  <text x="28" y="48" font-family="Noto Serif SC, serif" font-size="20" fill="#1c2418">补给线 · 空袭下的动员</text>
  <text x="28" y="78" font-family="EB Garamond, serif" font-size="14" fill="#3a4630">A typological supply line, cut and repaired — not a traffic count.</text>
  <path d="M80 280 C 180 240, 260 220, 340 200 S 500 140, 620 160 S 720 220, 720 260"
        fill="none" stroke="#d9a05a" stroke-width="4" stroke-dasharray="14 8" stroke-linecap="round"/>
  <circle cx="80" cy="280" r="7" fill="#5c6840"/>
  <circle cx="340" cy="200" r="7" fill="#c45c4a"/>
  <circle cx="720" cy="260" r="7" fill="#2c3a4a"/>
  <text x="70" y="310" font-family="Noto Serif SC, serif" font-size="13" fill="#1c2418">沈阳</text>
  <text x="64" y="326" font-family="IBM Plex Mono, monospace" font-size="10" fill="#3a4630">Shenyang</text>
  <text x="310" y="186" font-family="Noto Serif SC, serif" font-size="13" fill="#1c2418">丹东 / 鸭绿江</text>
  <text x="310" y="170" font-family="IBM Plex Mono, monospace" font-size="10" fill="#3a4630">Dandong / Yalu</text>
  <text x="680" y="290" font-family="Noto Serif SC, serif" font-size="13" fill="#1c2418">前方</text>
  <g transform="translate(470,120)" stroke="#7a96a8" fill="none" stroke-width="1.6">
    <path d="M0 20 L 40 0 L 80 20" />
    <path d="M16 20 L 40 8 L 64 20" />
  </g>
  <text x="470" y="112" font-family="IBM Plex Mono, monospace" font-size="11" fill="#7a96a8">air interdiction  ·  typological</text>

<text x="28" y="398" font-family="IBM Plex Mono, monospace" font-size="11" fill="#3a4630"> typological logistics  ·  类型学后勤，不是仓库清点</text>
</svg>
