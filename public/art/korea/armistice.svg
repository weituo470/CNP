<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">

  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0.25 0" in="n"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4d2a8"/>
      <stop offset="1" stop-color="#c9ae7e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#paper)"/>
  <rect width="800" height="420" filter="url(#grain)" opacity="0.45"/>
  <rect x="16" y="16" width="768" height="388" fill="none" stroke="#5a4330" stroke-width="1.2" stroke-opacity="0.45"/>


  <g transform="translate(640,28)">
    <rect x="0" y="0" width="132" height="44" fill="none" stroke="#9c2b1a" stroke-width="2"/>
    <text x="66" y="18" text-anchor="middle" font-family="Noto Serif SC, Songti SC, serif" font-size="13" fill="#9c2b1a">示意 · typological</text>
    <text x="66" y="34" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#9c2b1a">历史想象图</text>
  </g>


  <text x="28" y="48" font-family="Noto Serif SC, serif" font-size="20" fill="#1c2418">停战，不是和平条约</text>
  <text x="28" y="76" font-family="EB Garamond, serif" font-size="14" fill="#3a4630">Signed at Panmunjom, 27 July 1953. The line rests near, not on, the 38th parallel.</text>
  <line x1="80" y1="230" x2="720" y2="230" stroke="#9c2b1a" stroke-width="1.4" stroke-dasharray="8 6"/>
  <text x="80" y="222" font-family="IBM Plex Mono, monospace" font-size="12" fill="#9c2b1a">38°N</text>
  <path d="M80 260 C 220 250, 340 210, 420 200 S 600 170, 720 150" fill="none" stroke="#f0e6c0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="400" cy="204" r="7" fill="#9c2b1a"/>
  <text x="414" y="198" font-family="Noto Serif SC, serif" font-size="14" fill="#1c2418">板门店  Panmunjom</text>
  <text x="80" y="290" font-family="Noto Serif SC, serif" font-size="13" fill="#3a4630">军事分界线（示意）  ·  military demarcation line, typological</text>

<text x="28" y="398" font-family="IBM Plex Mono, monospace" font-size="11" fill="#3a4630"> armistice of 27 July 1953  ·  not a peace treaty</text>
</svg>
