<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">

  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0.25 0" in="n"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4d2a8"/>
      <stop offset="1" stop-color="#c9ae7e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#paper)"/>
  <rect width="800" height="420" filter="url(#grain)" opacity="0.45"/>
  <rect x="16" y="16" width="768" height="388" fill="none" stroke="#5a4330" stroke-width="1.2" stroke-opacity="0.45"/>


  <g transform="translate(640,28)">
    <rect x="0" y="0" width="132" height="44" fill="none" stroke="#9c2b1a" stroke-width="2"/>
    <text x="66" y="18" text-anchor="middle" font-family="Noto Serif SC, Songti SC, serif" font-size="13" fill="#9c2b1a">示意 · typological</text>
    <text x="66" y="34" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#9c2b1a">历史想象图</text>
  </g>


  <text x="28" y="48" font-family="Noto Serif SC, serif" font-size="20" fill="#1c2418">装备对照 · 米格走廊</text>
  <text x="28" y="76" font-family="EB Garamond, serif" font-size="14" fill="#3a4630">Typological contrast, not a museum scan of a particular aircraft.</text>
  <g transform="translate(90,160)">
    <polygon points="40,0 70,90 10,90" fill="none" stroke="#c9b48a" stroke-width="2.4"/>
    <text x="40" y="120" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="14" fill="#1c2418">轻装步兵</text>
    <text x="40" y="138" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#3a4630">light infantry</text>
  </g>
  <g transform="translate(300,200)" stroke="#7a96a8" fill="none" stroke-width="2.2">
    <rect x="0" y="0" width="90" height="28"/>
    <line x1="90" y1="14" x2="130" y2="14"/>
    <text x="45" y="56" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="14" fill="#1c2418" stroke="none">空军 / 坦克 / 炮</text>
    <text x="45" y="74" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#3a4630" stroke="none">UN air, armor, artillery</text>
  </g>
  <g transform="translate(520,130)" fill="none" stroke="#7ec8d4" stroke-width="2.2">
    <path d="M0 50 L 80 40 L 150 50 L 80 34 Z"/>
    <line x1="20" y1="46" x2="8" y2="70"/>
    <line x1="20" y1="46" x2="8" y2="22"/>
    <text x="80" y="90" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="14" fill="#1c2418" stroke="none">米格十五</text>
    <text x="80" y="108" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#3a4630" stroke="none">MiG-15  ·  MiG Alley</text>
  </g>
  <path d="M500 300 C 560 280, 620 260, 700 250" fill="none" stroke="#7ec8d4" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="500" y="324" font-family="Noto Serif SC, serif" font-size="12" fill="#2a3d55">鸭绿江一带空域示意</text>

<text x="28" y="398" font-family="IBM Plex Mono, monospace" font-size="11" fill="#3a4630"> typological equipment  ·  类型学装备，不是馆藏扫描</text>
</svg>
