  <!-- cabin hospital as converted public hall -->
  <g transform="translate(455,100)">
    <ellipse cx="80" cy="110" rx="74" ry="36" fill="#2a160c" opacity=".05" stroke="#2a160c" stroke-width="1.25" stroke-dasharray="6 5"/>
    <path d="M16 110 L 80 68 L 144 110" fill="none" stroke="#2a160c" stroke-width="1.4" stroke-dasharray="6 5"/>
    <path d="M40 132 H 120 M 50 148 H 110" stroke="#2a160c" stroke-width=".9" opacity=".5" stroke-dasharray="4 3"/>
    <text class="ink" x="80" y="200" text-anchor="middle" font-size="16">方舱</text>
    <text class="ink-soft" x="80" y="220" text-anchor="middle" font-size="12">公共建筑改建示意</text>
  </g>

  <text class="ink-soft" x="320" y="456" text-anchor="middle" font-size="13">医院建设与医疗队投送示意 · 2020</text>
  <text class="ink-soft" x="320" y="478" text-anchor="middle" font-size="12">工期与床位均为官方公布</text>
