<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-hidden="true">
  <defs>
    <style>
      .ink { font-family: "Noto Serif SC", "EB Garamond", "Songti SC", serif; fill: #2a160c; }
      .ink-soft { font-family: "Noto Serif SC", "EB Garamond", "Songti SC", serif; fill: #5a3a22; }
    </style>
  </defs>
  <ellipse cx="320" cy="490" rx="270" ry="26" fill="#2a160c" opacity=".08"/>
  <path d="M20 430 C 140 400, 280 440, 420 410 C 520 388, 600 420, 640 400 L 640 520 L 20 520 Z" fill="#2a160c" opacity=".05"/>

  <!-- Huoshenshan, fuller courtyard -->
  <g transform="translate(18,56)">
    <path d="M10 88 L 130 24 L 250 88" fill="#2a160c" opacity=".12" stroke="#2a160c" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M28 88 V 200 H 232 V 88" fill="#2a160c" opacity=".05" stroke="#2a160c" stroke-width="1.35"/>
    <path d="M28 88 H 232" stroke="#2a160c" stroke-width="1.3"/>
    <path d="M72 88 V 200 M 118 88 V 200 M 164 88 V 200 M 208 88 V 200" stroke="#2a160c" stroke-width=".85" opacity=".5"/>
    <path d="M28 124 H 232 M 28 160 H 232" stroke="#2a160c" stroke-width=".8" opacity=".45"/>
    <path d="M110 140 H 150 V 176 H 110 Z" fill="#2a160c" opacity=".04" stroke="#2a160c" stroke-width="1.15"/>
    <path d="M10 88 H 250" stroke="#2a160c" stroke-width="1" opacity=".5"/>
    <text class="ink" x="130" y="236" text-anchor="middle" font-size="18">火神山</text>
    <text class="ink-soft" x="130" y="258" text-anchor="middle" font-size="13">1.24 开工  ·  2.2 交付</text>
    <text class="ink" x="130" y="280" text-anchor="middle" font-size="13">官方公布：10 天  ·  1000 床</text>
  </g>

  <!-- Leishenshan -->
  <g transform="translate(230,56)">
    <path d="M10 88 L 130 18 L 250 88" fill="#2a160c" opacity=".12" stroke="#2a160c" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M28 88 V 200 H 232 V 88" fill="#2a160c" opacity=".05" stroke="#2a160c" stroke-width="1.35"/>
    <path d="M28 88 H 232" stroke="#2a160c" stroke-width="1.3"/>
    <path d="M72 88 V 200 M 118 88 V 200 M 164 88 V 200 M 208 88 V 200" stroke="#2a160c" stroke-width=".85" opacity=".5"/>
    <path d="M28 124 H 232 M 28 160 H 232" stroke="#2a160c" stroke-width=".8" opacity=".45"/>
    <path d="M110 140 H 150 V 176 H 110 Z" fill="#2a160c" opacity=".04" stroke="#2a160c" stroke-width="1.15"/>
    <text class="ink" x="130" y="236" text-anchor="middle" font-size="18">雷神山</text>
    <text class="ink-soft" x="130" y="258" text-anchor="middle" font-size="13">1.26 开工  ·  2.6 交付</text>
