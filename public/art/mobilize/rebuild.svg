<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-hidden="true">
  <defs>
    <style>
      .ink { font-family: "Noto Serif SC", "EB Garamond", "Songti SC", serif; fill: #2a160c; }
      .ink-soft { font-family: "Noto Serif SC", "EB Garamond", "Songti SC", serif; fill: #5a3a22; }
    </style>
  </defs>
  <path d="M-10 360 C 140 310, 260 390, 400 340 C 520 300, 590 350, 650 325 L 650 520 L -10 520 Z" fill="#2a160c" opacity=".08"/>
  <path d="M-10 362 C 140 312, 260 392, 400 342 C 520 302, 590 352, 650 327" fill="none" stroke="#2a160c" stroke-width="1.4" opacity=".45"/>
  <path d="M0 270 C 70 200, 140 220, 200 268 C 250 200, 340 190, 400 266 C 450 210, 530 220, 640 268 L 640 360 L 0 360 Z" fill="#2a160c" opacity=".08"/>
  <path d="M0 272 C 70 204, 140 224, 200 270 C 250 204, 340 194, 400 268 C 450 214, 530 224, 640 270" fill="none" stroke="#2a160c" stroke-width="1.25" opacity=".4"/>

  <!-- tents and sheds, fuller camp -->
  <g transform="translate(20,230)">
    <path d="M16 110 L 60 42 L 104 110 Z" fill="#2a160c" opacity=".12" stroke="#2a160c" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M60 42 V 110" stroke="#2a160c" stroke-width="1.1"/>
    <path d="M96 118 L 140 58 L 184 118 Z" fill="#2a160c" opacity=".1" stroke="#2a160c" stroke-width="1.45" stroke-linejoin="round"/>
    <path d="M140 58 V 118" stroke="#2a160c" stroke-width="1.05"/>
    <path d="M48 118 L 80 78 L 112 118 Z" fill="#2a160c" opacity=".08" stroke="#2a160c" stroke-width="1.2"/>
    <path d="M70 122 H 150 V 148 H 70 Z" fill="#2a160c" opacity=".06" stroke="#2a160c" stroke-width="1.15"/>
    <text class="ink" x="100" y="186" text-anchor="middle" font-size="16">临时安置</text>
    <text class="ink-soft" x="100" y="206" text-anchor="middle" font-size="12">帐篷 · 活动板房</text>
  </g>

  <!-- lifeline: road and poles crossing the middle -->
  <g transform="translate(220,230)">
    <path d="M0 128 C 60 110, 130 142, 200 112" fill="none" stroke="#2a160c" stroke-width="7" stroke-linecap="round" opacity=".18"/>
    <path d="M6 122 C 64 106, 132 136, 196 108" fill="none" stroke="#2a160c" stroke-width="1.6"/>
    <g stroke="#2a160c" fill="none" stroke-width="1.3">
      <path d="M36 118 V 44 M 24 56 H 48"/>
      <path d="M96 126 V 36 M 84 48 H 108"/>
      <path d="M156 116 V 44 M 144 56 H 168"/>
      <path d="M48 56 C 76 36, 116 36, 144 56"/>
    </g>
    <text class="ink" x="100" y="186" text-anchor="middle" font-size="16">生命线抢通</text>
    <text class="ink-soft" x="100" y="206" text-anchor="middle" font-size="12">交通 · 电力</text>
  </g>

  <!-- rebuilt houses -->
  <g transform="translate(430,210)">
    <path d="M10 130 L 56 70 L 102 130 Z" fill="#2a160c" opacity=".13" stroke="#2a160c" stroke-width="1.55" stroke-linejoin="round"/>
    <path d="M24 130 V 158 H 88 V 130" fill="#2a160c" opacity=".07" stroke="#2a160c" stroke-width="1.2"/>
    <path d="M50 130 V 158 M 44 144 H 76" stroke="#2a160c" stroke-width="1.05"/>
    <path d="M90 138 L 140 80 L 190 138 Z" fill="#2a160c" opacity=".13" stroke="#2a160c" stroke-width="1.55" stroke-linejoin="round"/>
    <path d="M106 138 V 166 H 174 V 138" fill="#2a160c" opacity=".07" stroke="#2a160c" stroke-width="1.2"/>
    <path d="M86 72 H 108 V 62 H 86 Z" fill="none" stroke="#2a160c" stroke-width="1.05"/>
    <text class="ink" x="100" y="206" text-anchor="middle" font-size="16">对口援建</text>
    <text class="ink-soft" x="100" y="226" text-anchor="middle" font-size="12">一省帮一重灾县</text>
  </g>

  <text class="ink-soft" x="320" y="500" text-anchor="middle" font-size="13">从安置到重建示意</text>
</svg>
