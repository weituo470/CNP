<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
  <rect width="100%" height="100%" fill="#f7f4ee"/>
  <rect x="28" y="28" width="1144" height="744" fill="none" stroke="#1b2430" stroke-opacity="0.18" stroke-width="1"/>
  <rect x="36" y="36" width="1128" height="728" fill="none" stroke="#8a3b32" stroke-opacity="0.35" stroke-width="1.2"/>
  
  <text x="64" y="90" fill="#8a3b32" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="4">PUBLIC  PLATFORMS  ·  TYPOLOGICAL</text>
  <text x="64" y="140" fill="#1b2430" font-family="Noto Serif SC, serif" font-size="32">只说已经公开亮相的东西</text>
  <g transform="translate(80,250)" fill="#3d5a6c">
    <rect x="40" y="80" width="280" height="28" rx="4"/>
    <rect x="180" y="48" width="50" height="32"/>
    <rect x="60" y="108" width="16" height="18"/>
    <rect x="250" y="108" width="16" height="18"/>
    <text x="180" y="180" text-anchor="middle" fill="#1b2430" font-family="Noto Serif SC, serif" font-size="18">航母剪影</text>
    <text x="180" y="204" text-anchor="middle" fill="#5a6570" font-family="IBM Plex Mono, monospace" font-size="12">Liaoning 2012 · Shandong 2019</text>
    <text x="180" y="222" text-anchor="middle" fill="#5a6570" font-family="IBM Plex Mono, monospace" font-size="12">Fujian launched 2022, commissioned 2025-11-05</text>
  </g>
  <g transform="translate(430,270)" fill="#3d5a6c">
    <polygon points="20,90 260,80 260,100 20,110"/>
    <rect x="110" y="58" width="70" height="24"/>
    <text x="150" y="160" text-anchor="middle" fill="#1b2430" font-family="Noto Serif SC, serif" font-size="18">〇五五型剪影</text>
    <text x="150" y="184" text-anchor="middle" fill="#5a6570" font-family="IBM Plex Mono, monospace" font-size="12">Nanchang commissioned 2020-01-12</text>
  </g>
  <g transform="translate(800,240)" fill="#3d5a6c">
    <polygon points="150,20 250,160 150,130 50,160"/>
    <text x="150" y="200" text-anchor="middle" fill="#1b2430" font-family="Noto Serif SC, serif" font-size="18">歼-20 平面示意</text>
    <text x="150" y="224" text-anchor="middle" fill="#5a6570" font-family="IBM Plex Mono, monospace" font-size="12">Officially inducted 2017–2018; official displays</text>
  </g>
  <text x="64" y="620" fill="#5a6570" font-family="Noto Serif SC, serif" font-size="16">火箭军是公开军种。不在此清点导弹，也不标记阵地。</text>
  <text x="64" y="650" fill="#5a6570" font-family="Inter, sans-serif" font-size="14">The Rocket Force is an official service. No missile inventory or sites are shown.</text>
  
  <g transform="translate(1060,120) rotate(-12)">
    <circle r="34" fill="none" stroke="#8a3b32" stroke-width="2.4"/>
    <circle r="28" fill="none" stroke="#8a3b32" stroke-width="0.8"/>
    <text text-anchor="middle" y="6" fill="#8a3b32" font-family="Noto Serif SC, Songti SC, serif" font-size="18" letter-spacing="4">示意</text>
  </g>
  
  <text x="64" y="760" fill="#5a6570" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="2">类型学剪影，不是泊位、跑道或船坞</text>
  <text x="64" y="778" fill="#5a6570" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1">Typological silhouettes, not berths, runways, or yards</text>


